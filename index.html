
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMC NETWORK | Staff Portal</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090811;color:white;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;padding:45px 15px;
 background:linear-gradient(135deg,#190b35,#351078,#100b20);
 border-bottom:1px solid #7540bd;
}
.logo{font-size:32px;font-weight:900;color:#c69aff}
header p{color:#c4b5d9}
.container{max-width:1000px;margin:auto;padding:30px 15px}
h2{text-align:center}
.english h2{color:#c69aff}
.roles{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:14px;margin-top:25px;
}
.card{
 background:#171322;border:1px solid #51316f;
 border-radius:13px;padding:22px 10px;
 text-align:center;cursor:pointer;transition:.25s;
}
.card:hover{
 transform:translateY(-5px);
 border-color:#c69aff;
 box-shadow:0 5px 20px #8c45c555;
}
.card h3{color:#c69aff;margin:0}
.card p{font-size:12px;color:#aaa}
.details{
 display:none;margin-top:22px;padding:22px;
 border:1px solid #8651bd;background:#171322;
 border-radius:14px;animation:show .3s;
}
.details h3{color:#c69aff}
.details li{margin:14px 0;color:#ddd}
button{
 background:#8245bd;color:white;border:0;
 padding:11px 20px;border-radius:8px;
 cursor:pointer;
}
.arabic{
 direction:rtl;
 background:#080f1d;
 border-top:3px solid #168ed0;
 padding-top:35px;padding-bottom:50px;
}
.arabic h2{color:#48baff}
.arabic .card{
 background:#101e30;border-color:#174c72;
}
.arabic .card h3{color:#55bdff}
.arabic .card:hover{
 border-color:#55bdff;
 box-shadow:0 5px 20px #168ed055;
}
.arabic .details{
 background:#101e30;border-color:#168ed0;
 text-align:right;
}
.arabic .details h3{color:#55bdff}
.arabic button{background:#087bb9}
footer{text-align:center;padding:25px;color:#777}
@keyframes show{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1;transform:translateY(0)}
}
@media(min-width:650px){
 .roles{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>
<a href="https://discord.gg/vuKgvpTqG"
target="_blank"
style="display:inline-block;
background:#5865F2;
color:white;
padding:13px 25px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
margin-top:15px;">
JOIN AMC NETWORK

 <div class="logo">AMC NETWORK</div>

<!-- ENGLISH SECTION -->

 <div class="roles" id="enRoles"></div>

<!-- ARABIC SECTION -->

 <div class="container">

<a href="https://discord.gg/vuKgvpTqG"

style="display:inline-block;background:#5865F2;
color:white;padding:13px 25px;border-radius:10px;
text-decoration:none;font-weight:bold">
انضم إلى AMC NETWORK

  </div>
  <p style="text-align:center;color:#9abbd3">
  اختر الرتبة الإدارية للاطلاع على مهامها ومسؤولياتها

  <div class="roles" id="arRoles"></div>

 </div>
</section>

<footer>
 AMC NETWORK © 2026 | Staff Portal

]
},

]

],

],

"Direct reports to the correct staff."
],

"مساعدة الأعضاء في حل مشاكلهم.",
"توجيه الشكاوى إلى المسؤول المختص."
]
}
];

function createCards(target, language){
 const area=document.getElementById(target);
 staff.forEach((person,index)=>{
  const card=document.createElement("div");
  card.className="card";
  const name=language==="en"?person.en:person.ar;
  card.innerHTML=`<h3>${name}</h3><p>${language==="en"?"View Responsibilities →":"عرض المهام ←"}</p>`;
  card.onclick=()=>showDetails(index,language);
  area.appendChild(card);
 });
}

function showDetails(index,language){
 const person=staff[index];
 const prefix=language==="en"?"en":"ar";
 document.getElementById(prefix+"Name").textContent=
 language==="en"?person.en:person.ar;
 const list=document.getElementById(prefix+"Tasks");
 list.innerHTML="";
 const tasks=language==="en"?person.enTasks:person.arTasks;
 tasks.forEach(task=>{
  const li=document.createElement("li");
  li.textContent=task;
  list.appendChild(li);
 });
 const box=document.getElementById(prefix+"Details");
 box.style.display="block";
 box.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function closeBox(id){
 document.getElementById(id).style.display="none";
}

createCards("enRoles","en");
createCards("arRoles","ar");
</script>
</body>
</html>
